<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#193b36">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{% block title %}Ausgaben{% endblock %}</title>
  <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register("{{ url_for('service_worker') }}")); }</script>
</head>
<body>
  <main class="page-shell">
    <header class="masthead"><a class="wordmark" href="{{ url_for('index') if session.get('user_name') else url_for('login') }}">AUSGABEN <span>/</span> ÜBERSICHT</a>{% if session.get('user_name') %}<span class="account">{{ session.get('user_name') }}</span>{% endif %}</header>
    {% if message %}<div class="notice" role="status">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
    <footer class="page-footer">Jede Ausgabe klar im Blick.</footer>
  </main>
</body>
</html>
