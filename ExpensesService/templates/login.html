{% extends "base.html" %}
{% block inhalt %}
<h1>Anmelden</h1>
{% if fehler %}<p class="fehler">{{ fehler }}</p>{% endif %}
<form method="post">
  <label for="name">Name</label>
  <input id="name" name="name" autocomplete="username" required>
  <label for="pw">Passwort</label>
  <input id="pw" name="pw" type="password" autocomplete="current-password" required>
  <button type="submit">Anmelden</button>
</form>
{% endblock %}
