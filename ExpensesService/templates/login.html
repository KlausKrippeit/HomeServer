{% extends 'base.html' %}
{% block title %}Sign in · Expenses{% endblock %}
{% block content %}
<section class="login-panel">
  <p class="eyebrow">PERSONAL FINANCE / 01</p>
  <h1>Keep your spending<br><em>in perspective.</em></h1>
  <p class="intro">Sign in to record, review, and report your expenses.</p>
  <form action="{{ url_for('login_post') }}" method="post" class="stack-form">
    <label for="user_name">Username</label><input id="user_name" name="user_name" autocomplete="username" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
